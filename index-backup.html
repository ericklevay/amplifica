<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amplifica. — Arte em Movimento | Junho 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #06110F; --teal: #1B5C52; --gold: #C9A85C;
      --cream: #F4EFE6; --cream-60: rgba(244,239,230,0.6); --cream-30: rgba(244,239,230,0.3);
      --border: rgba(201,168,92,0.18); --font-d: 'Baloo 2', sans-serif; --font-b: 'DM Sans', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--deep); color: var(--cream); font-family: var(--font-b); overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    .section-pad { padding: 6rem 2rem; }
    .tag { font-family: var(--font-b); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 0.75rem; }
    .heading { font-family: var(--font-d); font-weight: 800; font-size: clamp(2rem, 4.5vw, 3.2rem);
      line-height: 1.05; color: var(--cream); margin-bottom: 1.25rem; }
    .body-text { font-size: 1rem; line-height: 1.8; color: var(--cream-60); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

// EXPOSITORES CONFIRMADOS
const EXPOSITORES = [
  {
    name: 'Ju Caetano',
    brand: 'Brech\u00f3 Ju Caetano',
    tag: 'Moda',
    logo: 'uploads/ju-caetano-logo.jpg',
    instagram: 'brecho_jucaetano',
    galleryPhotos: ['uploads/ju-g1.jpg', 'uploads/ju-g2.jpg', 'uploads/ju-g3.jpg', 'uploads/ju-g4.jpg'],
  },
  {
    name: 'H\u00e9lvia Galdino',
    brand: 'HUNA \u2014 Acess\u00f3rios Autorais',
    tag: 'Arte',
    logo: 'uploads/huna-logo.jpg',
    instagram: 'huna.acessorios.autorais',
    galleryPhotos: ['uploads/huna-g1.jpg', 'uploads/huna-g2.jpg', 'uploads/huna-g3.jpg', 'uploads/huna-g4.jpg'],
  },
  {
    name: 'M\u00f4nica Freitas',
    brand: 'Quinha\'s Art',
    tag: 'Arte',
    logo: 'uploads/logo.jpg',
    instagram: 'monicadocarmofreitas',
    galleryPhotos: ['uploads/g1.jpg', 'uploads/g2.jpg', 'uploads/g3.jpg', 'uploads/g4.jpg'],
  },
];

function MiniGallery({ photos }) {
  const [lb, setLb] = useState(null);
  const slots = Array.from({length:4}).map((_,i) => photos[i] || null);
  return (
    <>
      <div style={{ display:'flex', gap:'4px', padding:'0.75rem 1.1rem 1rem' }}>
        {slots.map((src,i) => (
          <div key={i} onClick={() => src && setLb(src)} style={{
            flex:1, aspectRatio:'1', overflow:'hidden', borderRadius:8,
            background:'rgba(27,92,82,0.18)', cursor: src ? 'zoom-in' : 'default',
            border:'1px solid rgba(201,168,92,0.1)',
          }}>
            {src ? (
              <img src={src} alt={`foto ${i+1}`} style={{
                width:'100%', height:'100%', objectFit:'cover', transition:'transform 0.3s, opacity 0.2s', opacity:0.88
              }}
              onMouseEnter={e => { e.currentTarget.style.transform='scale(1.1)'; e.currentTarget.style.opacity='1'; }}
              onMouseLeave={e => { e.currentTarget.style.transform='scale(1)'; e.currentTarget.style.opacity='0.88'; }}
              />
            ) : (
              <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center' }}>
                <svg width="16" height="16" viewBox="0 0 30 30" fill="none" stroke="rgba(201,168,92,0.18)" strokeWidth="1.4">
                  <rect x="2" y="5" width="26" height="20" rx="3"/><circle cx="11" cy="14" r="3"/>
                  <path d="M2 21 L9 15 L15 21 L21 14 L28 21" strokeLinejoin="round"/>
                </svg>
              </div>
            )}
          </div>
        ))}
      </div>
      {lb && (
        <div onClick={() => setLb(null)} style={{ position:'fixed', inset:0, zIndex:3000, background:'rgba(6,17,15,0.97)',
          display:'flex', alignItems:'center', justifyContent:'center', padding:'2rem' }}>
          <img src={lb} style={{ maxWidth:'88vw', maxHeight:'86vh', objectFit:'contain', borderRadius:10 }}/>
          <button onClick={() => setLb(null)} style={{ position:'absolute', top:'1.5rem', right:'1.5rem',
            background:'rgba(201,168,92,0.15)', border:'1px solid rgba(201,168,92,0.3)', borderRadius:'50%',
            width:42, height:42, color:'var(--gold)', fontSize:'1rem', cursor:'pointer', display:'flex',
            alignItems:'center', justifyContent:'center' }}>✕</button>
        </div>
      )}
    </>
  );
}

function ExpositorCard({ name, brand, tag, logo, instagram, galleryPhotos }) {
  return (
    <div style={{
      background:'rgba(27,92,82,0.12)', border:'1px solid rgba(201,168,92,0.18)',
      borderRadius:'18px', overflow:'hidden', transition:'transform 0.25s, border-color 0.25s',
      display:'flex', flexDirection:'column',
    }}
    onMouseEnter={e => { e.currentTarget.style.transform='translateY(-4px)'; e.currentTarget.style.borderColor='rgba(201,168,92,0.38)'; }}
    onMouseLeave={e => { e.currentTarget.style.transform='translateY(0)'; e.currentTarget.style.borderColor='rgba(201,168,92,0.18)'; }}
    >
      <div style={{ aspectRatio:'1', overflow:'hidden', background:'#F4EFE6', flexShrink:0 }}>
        {logo ? (
          <img src={logo} alt={brand} style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition:'center' }}/>
        ) : (
          <div style={{ width:'100%', height:'100%', background:'linear-gradient(135deg, rgba(27,92,82,0.25), rgba(26,43,95,0.25))',
            display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="20" r="11" stroke="rgba(201,168,92,0.35)" strokeWidth="1.5"/>
              <path d="M6 44c0-9.941 8.059-18 18-18s18 8.059 18 18" stroke="rgba(201,168,92,0.35)" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </div>
        )}
      </div>
      <div style={{ padding:'1rem 1.1rem 0.9rem' }}>
        <div style={{ fontFamily:'var(--font-d)', fontWeight:800, fontSize:'1.05rem', color:'var(--cream)', marginBottom:'0.15rem' }}>{brand}</div>
        <div style={{ fontFamily:'var(--font-b)', fontSize:'0.78rem', color:'var(--cream-60)', marginBottom:'0.5rem' }}>{name}</div>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:'0.4rem' }}>
          {tag && (
            <span style={{ padding:'3px 10px', borderRadius:100, border:'1px solid rgba(201,168,92,0.22)',
              fontFamily:'var(--font-b)', fontSize:'0.6rem', fontWeight:700, letterSpacing:'0.1em',
              textTransform:'uppercase', color:'var(--gold)' }}>
              {tag}
            </span>
          )}
        </div>
      </div>
      {galleryPhotos.length > 0 && (
        <div style={{ borderTop:'1px solid rgba(201,168,92,0.08)' }}>
          <MiniGallery photos={galleryPhotos}/>
        </div>
      )}
      {instagram && (
        <a href={`https://instagram.com/${instagram}`} target="_blank" rel="noopener noreferrer"
          style={{ padding:'0 1.1rem 0.85rem', display:'flex', alignItems:'center', gap:'0.4rem',
            fontFamily:'var(--font-b)', fontSize:'0.72rem', color:'rgba(201,168,92,0.55)', transition:'color 0.2s' }}
          onMouseEnter={e => e.currentTarget.style.color='var(--gold)'}
          onMouseLeave={e => e.currentTarget.style.color='rgba(201,168,92,0.55)'}
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
          @{instagram}
        </a>
      )}
    </div>
  );
}

function Artistas() {
  return (
    <section id="artistas" className="section-pad" style={{ maxWidth:1160, margin:'0 auto' }}>
      <span className="tag">Line-up</span>
      <h2 className="heading">Artistas & Expositores</h2>
      <p className="body-text" style={{ maxWidth:480, marginBottom:'3rem' }}>
        Confira quem j\u00e1 est\u00e1 confirmado. Em breve mais an\u00fanchos!
      </p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px,1fr))', gap:'1.25rem', marginBottom:'2rem' }}>
        {EXPOSITORES.map(e => <ExpositorCard key={e.name} {...e}/>)}
        {Array.from({length:6}).map((_,i) => (
          <div key={i} style={{
            background:'rgba(27,92,82,0.07)', border:'1px dashed rgba(201,168,92,0.11)',
            borderRadius:'18px', aspectRatio:'1', display:'flex', flexDirection:'column',
            alignItems:'center', justifyContent:'center', gap:'0.65rem',
          }}>
            <div style={{ width:48, height:48, borderRadius:'50%', background:'rgba(201,168,92,0.08)', border:'1px solid rgba(201,168,92,0.14)' }}/>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
              <div style={{ width:55, height:7, borderRadius:4, background:'rgba(201,168,92,0.08)' }}/>
              <div style={{ width:36, height:5, borderRadius:3, background:'rgba(201,168,92,0.05)' }}/>
            </div>
          </div>
        ))}
      </div>
      <div style={{ textAlign:'center', fontFamily:'var(--font-b)', fontSize:'0.72rem', fontWeight:600,
        letterSpacing:'0.15em', textTransform:'uppercase', color:'rgba(201,168,92,0.38)' }}>
        Em breve mais confirma\u00e7\u00f5es \u2014 Fique ligado em @amplifica.arte
      </div>
    </section>
  );
}

function App() {
  return <Artistas/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
