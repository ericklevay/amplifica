function useCountdown() {
  const target = new Date('2026-06-11T17:00:00-03:00').getTime();
  const calc = () => {
    const d = target - Date.now();
    if (d <= 0) return { days:0, hours:0, minutes:0, seconds:0 };
    return { days: Math.floor(d/864e5), hours: Math.floor((d%864e5)/36e5), minutes: Math.floor((d%36e5)/6e4), seconds: Math.floor((d%6e4)/1e3) };
  };
  const [t, setT] = useState(calc);
  useEffect(() => { const id = setInterval(() => setT(calc()), 1000); return () => clearInterval(id); }, []);
  return t;
}

function Nav({ menuOpen, setMenuOpen }) {
  const [scrolled, setScrolled] = useState(false);

    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);

            >{label}</a>
          ))}
        </div>
        <button className="mobile-btn" onClick={() => setMenuOpen(!menuOpen)} style={{ background:'none', border:'none', color:'var(--gold)', fontSize:'1.4rem', padding:'0.2rem' }}>
