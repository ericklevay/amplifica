<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amplifica. — Arte Instagram 4×5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── shared tokens ──────────────────────────── */
const G  = '#C9A85C';
const D  = '#06110F';
const T  = '#1B5C52';
const C  = '#F4EFE6';
const fd = "'Baloo 2', sans-serif";
const fb = "'DM Sans', sans-serif";

function Swatches() {
  return (
    <div style={{ display:'flex', gap:7 }}>
      {['#7A3728','#C9A85C','#EDE8DF','#7A5E8B'].map(c => (
        <div key={c} style={{ width:15, height:15, borderRadius:4, background:c, opacity:0.8 }}/>
      ))}
    </div>
  );
}

function SunMotif({ size=130, opacity=0.45 }) {
  return (
    <div style={{ width:size, height:size, opacity }}>
      <svg viewBox="0 0 100 100" fill="none" style={{ width:'100%', height:'100%' }}>
        <circle cx="50" cy="50" r="46" stroke={G} strokeWidth="0.8"/>
        <circle cx="50" cy="50" r="7"  fill={G} fillOpacity="0.5"/>
        {Array.from({length:16}).map((_,i) => {
          const a=(i*22.5)*Math.PI/180;
          const x1=50+20*Math.cos(a), y1=50+20*Math.sin(a);
          const x2=50+44*Math.cos(a), y2=50+44*Math.sin(a);
          return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={G} strokeWidth={i%2===0?1.2:0.5}/>;
        })}
      </svg>
    </div>
  );
}

function Divider() {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:18 }}>
      <div style={{ flex:1, height:1, background:'rgba(201,168,92,0.25)' }}/>
      <span style={{ color:G, fontSize:16 }}>✦</span>
      <div style={{ flex:1, height:1, background:'rgba(201,168,92,0.25)' }}/>
    </div>
  );
}

function Strip() {
  return (
    <div style={{ borderTop:'1px solid rgba(201,168,92,0.12)', paddingTop:22, fontSize:12, fontWeight:700, letterSpacing:'0.26em', textTransform:'uppercase', color:'rgba(201,168,92,0.4)' }}>
      MODA &bull; ARTE &bull; MÚSICA &bull; GASTRONOMIA &bull; CULTURA
    </div>
  );
}

/* ══════════════════════════════════════════════
   ART 1 — ATMOSFERA
   Foto de fundo, overlay gradiente, centrado
══════════════════════════════════════════════ */
function Art1() {
  return (
    <div style={{ width:1080, height:1350, position:'relative', overflow:'hidden', fontFamily:fb }}>

      {/* Photo BG */}
      <div style={{
        position:'absolute', inset:0,
        backgroundImage:"url(uploads/03f58653-f479-45c2-9ac9-dc79c9acd71a.JPG)",
        backgroundSize:'cover', backgroundPosition:'center 28%',
      }}/>

      {/* Overlay */}
      <div style={{
        position:'absolute', inset:0,
        background:'linear-gradient(180deg, rgba(10,38,34,0.80) 0%, rgba(26,43,95,0.50) 30%, rgba(10,38,34,0.82) 62%, rgba(6,17,15,0.99) 100%)',
      }}/>

      {/* Vertical text */}
      <div style={{ position:'absolute', left:0, top:0, bottom:0, width:42, display:'flex', alignItems:'center', justifyContent:'center' }}>
        <span style={{ writingMode:'vertical-rl', transform:'rotate(180deg)', fontFamily:fb, fontSize:10, fontWeight:600, letterSpacing:'0.28em', textTransform:'uppercase', color:'rgba(201,168,92,0.3)', whiteSpace:'nowrap' }}>
          Moda • Arte • Música • Gastronomia • Cultura
        </span>
      </div>

      {/* Sun top-right */}
      <div style={{ position:'absolute', top:55, right:55 }}>
        <SunMotif size={130} opacity={0.48}/>
      </div>

      {/* Content */}
      <div style={{ position:'absolute', inset:0, zIndex:2, display:'flex', flexDirection:'column', padding:'55px 72px' }}>

        {/* Top bar */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <Swatches/>
          <span style={{ fontSize:14, fontWeight:600, letterSpacing:'0.2em', textTransform:'uppercase', color:'rgba(244,239,230,0.45)' }}>
            Arte em Movimento
          </span>
        </div>

        {/* Center */}
        <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', gap:0 }}>

          {/* Edition pill */}
          <div style={{
            background:'rgba(201,168,92,0.1)', border:'1px solid rgba(201,168,92,0.28)',
            borderRadius:100, padding:'8px 30px', marginBottom:50,
            fontSize:13, fontWeight:700, letterSpacing:'0.18em', textTransform:'uppercase',
            color:'rgba(201,168,92,0.75)',
          }}>Junho 2026 — Olinda, PE</div>

          {/* Logo */}
          <img src="uploads/logo-amplifica.png"
            style={{ width:780, height:'auto', filter:'drop-shadow(0 12px 55px rgba(201,168,92,0.5))', marginBottom:52 }}
          />

          <Divider/>

          {/* Date cards */}
          <div style={{ display:'flex', gap:18, marginTop:46, marginBottom:46 }}>
            {[{n:'11',d:'Sexta'},{n:'12',d:'Sábado'},{n:'13',d:'Domingo'}].map(({n,d}) => (
              <div key={n} style={{
                background:'rgba(201,168,92,0.08)', border:'1px solid rgba(201,168,92,0.22)',
                borderRadius:18, padding:'22px 34px', textAlign:'center',
              }}>
                <div style={{ fontFamily:fd, fontWeight:800, fontSize:58, color:G, lineHeight:1 }}>{n}</div>
                <div style={{ fontSize:12, color:'rgba(244,239,230,0.42)', letterSpacing:'0.14em', textTransform:'uppercase', marginTop:5 }}>Junho</div>
                <div style={{ fontSize:11, color:'rgba(201,168,92,0.5)', letterSpacing:'0.1em', textTransform:'uppercase', marginTop:2 }}>{d}</div>
              </div>
            ))}
          </div>

          {/* Tagline */}
          <p style={{ fontSize:21, color:'rgba(244,239,230,0.52)', fontStyle:'italic', marginBottom:44, letterSpacing:'0.02em' }}>
            Movimento Multicultural conectando arte e criatividade
          </p>

          {/* Location + free */}
          <div style={{ display:'flex', gap:20, alignItems:'center', flexWrap:'wrap', justifyContent:'center' }}>
            <span style={{ fontSize:17, color:'rgba(244,239,230,0.58)', display:'flex', alignItems:'center', gap:8 }}>
              📍 Rua do Amparo, 213 — Olinda, PE
            </span>
            <span style={{
              background:G, color:D,
              padding:'10px 26px', borderRadius:100,
              fontWeight:800, fontSize:13, letterSpacing:'0.1em', textTransform:'uppercase',
            }}>Entrada Gratuita</span>
          </div>
        </div>

        <Strip/>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   ART 2 — EDITORIAL
   Fundo escuro puro, tipografia grande, strip de fotos
══════════════════════════════════════════════ */
function Art2() {
  return (
    <div style={{ width:1080, height:1350, position:'relative', overflow:'hidden', background:'#070E0D', fontFamily:fb }}>

      {/* Ghost "AMP" BG */}
      <div style={{
        position:'absolute', bottom:-30, left:-30, right:-30,
        fontFamily:fd, fontWeight:800, fontSize:360, lineHeight:0.8,
        color:'rgba(27,92,82,0.09)', letterSpacing:'-0.06em',
        userSelect:'none', textAlign:'center',
      }}>AMP</div>

      {/* Circles deco */}
      <div style={{ position:'absolute', right:-90, top:260, width:560, height:560, borderRadius:'50%', border:'1px solid rgba(201,168,92,0.07)' }}/>
      <div style={{ position:'absolute', right:-150, top:200, width:660, height:660, borderRadius:'50%', border:'1px solid rgba(27,92,82,0.13)' }}/>

      {/* Content */}
      <div style={{ position:'absolute', inset:0, zIndex:2, padding:'65px 80px', display:'flex', flexDirection:'column' }}>

        {/* Top */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:44 }}>
          <div>
            <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(201,168,92,0.42)', marginBottom:8 }}>Arte em Movimento</div>
            <div style={{ fontFamily:fd, fontSize:34, fontWeight:800, color:G }}>AMP 213</div>
          </div>
          <Swatches/>
        </div>

        {/* Ghost date */}
        <div style={{ fontFamily:fd, fontWeight:800, fontSize:136, lineHeight:0.88, color:'rgba(201,168,92,0.09)', letterSpacing:'-0.04em', marginBottom:10 }}>
          11.12.13
        </div>
        <div style={{ fontSize:16, fontWeight:700, letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(201,168,92,0.48)', marginBottom:28 }}>
          de Junho de 2026
        </div>

        {/* Teal accent bar */}
        <div style={{ width:65, height:3, background:T, borderRadius:2, marginBottom:52 }}/>

        {/* Logo */}
        <img src="uploads/logo-amplifica.png" style={{ width:700, height:'auto' }}/>

        {/* Tagline */}
        <p style={{ fontSize:22, color:'rgba(244,239,230,0.42)', fontStyle:'italic', marginTop:28, maxWidth:640, lineHeight:1.65 }}>
          Movimento Multicultural conectando<br/>arte e criatividade em Olinda.
        </p>

        {/* Category pills */}
        <div style={{ display:'flex', gap:10, marginTop:34, flexWrap:'wrap' }}>
          {['Moda','Arte','Música','Gastronomia','Cultura'].map(c => (
            <span key={c} style={{
              padding:'7px 20px', border:'1px solid rgba(201,168,92,0.2)', borderRadius:100,
              fontSize:11, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase',
              color:'rgba(201,168,92,0.52)',
            }}>{c}</span>
          ))}
        </div>

        <div style={{ flex:1 }}/>

        {/* Photo strip */}
        <div style={{ display:'flex', gap:10, height:195, marginBottom:36, overflow:'hidden', borderRadius:14 }}>
          {[
            'uploads/e53f2197-7d8a-4358-b72c-01ea1f4c80c2.JPG',
            'uploads/143d8495-1a05-4a15-8dae-07d3752d1922.jpg',
            'uploads/A75B2A56-9DC0-4AA9-9DFA-6F6E65DC5731.jpg',
            'uploads/13b87dd0-4492-412d-b92d-c59b933da479.jpg',
          ].map((src,i) => (
            <div key={i} style={{ flex:1, overflow:'hidden', borderRadius:10 }}>
              <img src={src} style={{ width:'100%', height:'100%', objectFit:'cover', filter:'brightness(0.62) saturate(0.72)' }}/>
            </div>
          ))}
        </div>

        {/* Bottom row */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:28 }}>
          <span style={{ fontSize:16, color:'rgba(244,239,230,0.42)' }}>📍 Rua do Amparo, 213 — Olinda, PE</span>
          <span style={{
            background:'rgba(201,168,92,0.1)', border:'1px solid rgba(201,168,92,0.28)',
            padding:'9px 22px', borderRadius:100,
            color:G, fontSize:12, fontWeight:800, letterSpacing:'0.1em', textTransform:'uppercase',
          }}>Entrada Gratuita</span>
        </div>

        <Strip/>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   ART 3 — VIBRANTE
   Tiras de fotos, overlay pesado à esq, texto à esq
══════════════════════════════════════════════ */
function Art3() {
  const photos = [
    'uploads/03f58653-f479-45c2-9ac9-dc79c9acd71a.JPG',
    'uploads/ef87d926-c538-441e-88c6-20074a8f3307.jpg',
    'uploads/e53f2197-7d8a-4358-b72c-01ea1f4c80c2.JPG',
    'uploads/A75B2A56-9DC0-4AA9-9DFA-6F6E65DC5731.jpg',
    'uploads/143d8495-1a05-4a15-8dae-07d3752d1922.jpg',
  ];

  return (
    <div style={{ width:1080, height:1350, position:'relative', overflow:'hidden', fontFamily:fb }}>

      {/* Photo strips BG */}
      <div style={{ position:'absolute', inset:0, display:'flex' }}>
        {photos.map((src,i) => (
          <div key={i} style={{ flex:1, overflow:'hidden' }}>
            <img src={src} style={{ width:'100%', height:'100%', objectFit:'cover', filter:'brightness(0.52) saturate(0.82)' }}/>
          </div>
        ))}
      </div>

      {/* Left-heavy gradient */}
      <div style={{
        position:'absolute', inset:0,
        background:'linear-gradient(108deg, rgba(6,17,15,0.98) 0%, rgba(10,38,34,0.94) 38%, rgba(10,38,34,0.72) 58%, rgba(10,38,34,0.32) 100%)',
      }}/>

      {/* Content */}
      <div style={{ position:'absolute', inset:0, zIndex:2, padding:'65px 82px', display:'flex', flexDirection:'column' }}>

        {/* Top */}
        <div style={{ marginBottom:0 }}>
          <Swatches/>
          <div style={{ marginTop:12, fontSize:10, fontWeight:600, letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(244,239,230,0.32)' }}>Arte em Movimento</div>
        </div>

        {/* Main */}
        <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center' }}>

          {/* Pill */}
          <div style={{
            display:'inline-block', marginBottom:42,
            background:'rgba(201,168,92,0.1)', border:'1px solid rgba(201,168,92,0.28)',
            borderRadius:100, padding:'8px 26px',
            fontSize:12, fontWeight:700, letterSpacing:'0.18em', textTransform:'uppercase',
            color:'rgba(201,168,92,0.72)',
          }}>Junho 2026</div>

          {/* Logo */}
          <img src="uploads/logo-amplifica.png"
            style={{ display:'block', width:710, height:'auto', marginBottom:42, filter:'drop-shadow(0 6px 32px rgba(201,168,92,0.45))' }}
          />

          {/* Big date */}
          <div style={{ fontFamily:fd, fontWeight:800, fontSize:108, color:G, lineHeight:0.9, letterSpacing:'-0.02em', marginBottom:14 }}>
            11, 12 e 13
          </div>
          <div style={{ fontSize:19, fontWeight:700, letterSpacing:'0.15em', textTransform:'uppercase', color:'rgba(244,239,230,0.52)', marginBottom:52 }}>
            de Junho
          </div>

          {/* Sep */}
          <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:42, maxWidth:220 }}>
            <div style={{ flex:1, height:1, background:'rgba(201,168,92,0.3)' }}/>
            <span style={{ color:'rgba(201,168,92,0.4)', fontSize:14 }}>✦</span>
            <div style={{ flex:1, height:1, background:'rgba(201,168,92,0.3)' }}/>
          </div>

          {/* Location block */}
          <div style={{ marginBottom:38 }}>
            <div style={{ fontFamily:fd, fontWeight:800, fontSize:26, color:G, marginBottom:8 }}>AMP 213</div>
            <div style={{ fontSize:18, color:'rgba(244,239,230,0.58)', lineHeight:1.65 }}>
              Rua do Amparo, 213 — Olinda, PE<br/>
              <span style={{ fontSize:15, color:'rgba(244,239,230,0.32)' }}>Em frente à Bodega de Véio</span>
            </div>
          </div>

          {/* Free badge */}
          <div style={{
            display:'inline-block',
            background:G, color:D,
            padding:'12px 32px', borderRadius:100,
            fontWeight:800, fontSize:14, letterSpacing:'0.1em', textTransform:'uppercase',
          }}>🎉 Entrada Gratuita</div>
        </div>

        <Strip/>
      </div>
    </div>
  );
}

/* ── APP ────────────────────────────────────── */
function App() {
  return (
    <DesignCanvas title="amplifica. — Arte Instagram 4×5 (1080×1350)">
      <DCSection id="s1" title="Variações de Arte">
        <DCArtboard id="a1" label="01 · Atmosfera" width={1080} height={1350}><Art1/></DCArtboard>
        <DCArtboard id="a2" label="02 · Editorial" width={1080} height={1350}><Art2/></DCArtboard>
        <DCArtboard id="a3" label="03 · Vibrante"  width={1080} height={1350}><Art3/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#0A2622"/>
    <text x="60" y="48" font-size="22" fill="#C9A85C" text-anchor="middle" font-weight="bold" font-family="serif">amp.</text>
  </svg>
</template>
</body>
</html>
